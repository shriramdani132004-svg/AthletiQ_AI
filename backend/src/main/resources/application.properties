spring.application.name=${APP_NAME:athletiq-backend}
server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:athletiq}?sslmode=disable
spring.datasource.username=${POSTGRES_USER:athletiq}
spring.datasource.password=${POSTGRES_PASSWORD:athletiq_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

athletiq.mail.enabled=${MAIL_ENABLED:true}
athletiq.mail.from=${MAIL_FROM:no-reply@athletiq.local}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.athletiq=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n


# JWT configuration
athletiq.security.jwt.secret=${ATHLETIQ_JWT_SECRET:AthletiQDevelopmentSecretKeyMustBeAtLeast32CharactersLong12345}
athletiq.security.jwt.access-token-expiration-minutes=${ATHLETIQ_JWT_EXPIRATION_MINUTES:30}
athletiq.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}